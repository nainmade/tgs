<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<title>The Gera School — Timetable 2026–27</title>
<link rel="stylesheet" href="assets/css/shared.css">
<link rel="stylesheet" href="assets/css/timetable.css">
</head>
<body data-page="timetable" data-sticky="on">
<div class="shell">

  <div class="stickybar" id="stickybar">
    <nav class="page-switch" aria-label="Page sections">
      <a href="index.html" data-nav="holiday-planner">Holiday Planner</a>
      <a href="timetable.html" data-nav="timetable" aria-current="page">Timetable</a>
      <!-- Exams tab hidden — Term I exams over; restore for next term's exams.
      <a href="exams.html" data-nav="exams">Exams</a> -->
    </nav>

    <header class="masthead">
      <div class="mast-left">
        <div>
          <div class="mast-eyebrow"><span>The Gera School - Parent Handbook</span></div>
          <h1 class="mast-title">Timetable</h1>
        </div>
      </div>
      <div class="mast-meta">
        <div class="year">Academic Year 2026/27</div>
        <div class="sub"><span id="generated-tag">Updated —</span></div>
      </div>
    </header>

    <div class="toolbar">
      <div class="filters" role="tablist" aria-label="Grade group">
        <!-- filled by JS -->
      </div>
      <div class="tools view-switcher">
        <span class="tool tool-spacer" aria-hidden="true"></span>
        <span class="tool tool-spacer" aria-hidden="true"></span>
        <label class="theme-switch" title="Toggle light / dark" aria-label="Toggle light / dark">
          <input type="checkbox" id="theme-toggle">
          <span class="track">
            <svg class="ico sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <svg class="ico moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <span class="knob"></span>
          </span>
        </label>
      </div>
    </div>
  </div>

  <div class="grade-pills" id="grade-pills" role="tablist" aria-label="Class"></div>

  <!-- Timetable -->
  <section aria-labelledby="tt-title">
    <div class="tt-head">
      <h2 id="tt-title">—</h2>
      <div class="updated" id="tt-updated"></div>
    </div>
    <div class="tt-wrapper">
      <div class="tt-scroll">
        <table class="tt" id="tt-table">
          <!-- filled by JS -->
        </table>
      </div>
    </div>
  </section>

  <!-- Legend -->
  <section class="legend-section" aria-label="Subject key">
    <details class="legend-details">
      <summary class="legend-head">
        <h2>Subject Key</h2>
        <span class="legend-meta">
          <span class="count">Abbreviations</span>
          <svg class="legend-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </summary>
      <div id="legend-container"></div>
    </details>
  </section>

  <div class="footnote">
    <div>Generated from school timetable PDF · <span id="footer-date">—</span></div>
    <div>Made by a parent from <a href="https://www.thegeraschool.com" target="_blank" rel="noopener noreferrer">The Gera School</a> community.</div>
  </div>

</div>

<script src="assets/js/shared.js" defer></script>
<script src="assets/js/timetable.js" defer></script>
</body>
</html>
